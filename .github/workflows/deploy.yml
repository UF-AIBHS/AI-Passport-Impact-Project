name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run get-theme
      - run: npm run build:sass
      - run: npx cross-env ELEVENTY_ENV=prod eleventy --pathprefix=/${{ github.event.repository.name }}/
        env:
          SITE_NAME_HEADER: UF AI Passport Projects
          SITE_BASE_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          BASE_THEME: dark
          dgHomeLink: "true"
          dgShowBacklinks: "true"
          dgShowLocalGraph: "true"
          dgShowInlineTitle: "true"
          dgShowFileTree: "true"
          dgEnableSearch: "true"
          dgShowToc: "true"
          dgLinkPreview: "true"
          dgShowTags: "true"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
